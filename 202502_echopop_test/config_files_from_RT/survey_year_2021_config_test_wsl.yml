# This YAML file is a configuration file specifying
# input filenames & some process parameter settings.
# Relative file paths defined below are concatenated
# with the data_root_dir path also set below.

---
##############################################################################
# Parameters

survey_year: 2021            # survey year being considered
species:
  text_code: pacific_hake    # target species for the survey year -- species name
  number_code: 22500         # target species for the survey year -- numeric code
CAN_haul_offset: 200         # The value to be added to the Canadian's haul number
report_path:    /mnt/c/rthomas/Projects/EchoPop_validation/Reports/2021/EchoPop           # Path to output reports

##############################################################################
# Directory path that contains all input data needed

data_root_dir: /mnt/c/rthomas/Projects/EchoPop_validation/data

##############################################################################
# Input data files

biological:
  length:
    US:
      filename: Biological/2021/US/2021_biodata_length.xlsx
      sheetname: Sheet1
    CAN:
      filename: Biological/2021/CAN/2021_biodata_length_CAN.xlsx
      sheetname: Sheet1
  specimen:
    US:
      filename: Biological/2021/US/2021_biodata_specimen.xlsx
      sheetname: Sheet1
    CAN:
      filename: Biological/2021/CAN/2021_biodata_specimen_CAN_AGES.xlsx
      sheetname: Sheet1
  catch:
    US:
      filename: Biological/2021/US/2021_biodata_catch.xlsx
      sheetname: Sheet1
    CAN:
      filename: Biological/2021/CAN/2021_biodata_catch_CAN.xlsx
      sheetname: Sheet1
  #haul_to_transect:
  #  US:
  #    filename: Biological/US/haul_to_transect_mapping_2023.xlsx
  #    sheetname: Sheet1
  #  CAN:
  #    filename: Biological/CAN/haul_to_transect_mapping_2023_CAN.xlsx
  #    sheetname: Sheet1
stratification:
  strata:
    # The two stratification types are found in two sheets: "Base KS" and "INPFC"
    filename: Stratification/2021/US&CAN strata 2021_EP_14-Jan-2025.xlsx
    sheetname: [ INPFC , Base KS ]
  geo_strata:
    # The two stratification types are found in two sheets: "stratification1" and "INPFC"
    filename: Stratification/2021/Stratification_geographic_Lat_2021_EP_14-Jan-2025.xlsx
    sheetname: [ INPFC , Base KS ]
NASC:
  # NASC values
  no_age1:
    # file that excludes age1 values
    #filename: Exports/US_CAN_detailsa_2019_table2y+_ALL_final - updated.xlsx
    filename: Exports/2021/US_CAN_NASC_2021_table_no_age1.xlsx
    sheetname: Sheet1
  all_ages:
    # file that includes all ages
    #filename: Exports/US_CAN_detailsa_2019_table1y+_ALL_final - updated.xlsx
    filename: Exports/2021/US_CAN_NASC_2021_table_all_ages.xlsx
    sheetname: Sheet1
export_regions:
  all_ages:
    # filename: Stratification/US_CAN_2019_transect_region_haul_age1+ auto_final.xlsx
    filename: Stratification/2021/CAN_US_2021_transect_region_haul_all_ages.xlsx
    sheetname: Sheet1
  no_age1:
    filename: Stratification/2021/CAN_US_2021_transect_region_haul_no_age1.xlsx
    sheetname: Sheet1
gear_data:
  US:
    filename: Biological/US/2021/2021_biodata_gear.xlsx
    sheetname: biodata_gear
  CAN:
    filename: Biological/CAN/2021/2021_biodata_gear_CAN.xlsx
    sheetname: DFO_biodata_gear
kriging:
  mesh:
    filename: Kriging files & parameters/Kriging grid files/krig_grid2_5nm_cut_centroids_2013.xlsx
    sheetname: krigedgrid2_5nm_forChu
  isobath_200m:
    # filename: Kriging_files/Kriging_grid_files/Smoothing_EasyKrig.xlsx
    filename: Kriging files & parameters/Kriging grid files/transformation_isobath_coordinates.xlsx
    sheetname: Smoothing_EasyKrig
  vario_krig_para:
    # NOTE: This file is not currently used
    filename: Kriging files & parameters/2021/default_vario_krig_settings_2021_US&CAN.xlsx
    sheetname: Sheet1
...
