# This YAML file is a configuration file specifying
# input filenames & some process parameter settings.
# Relative file paths defined below are concatenated
# with the data_root_dir path also set below.

---
##############################################################################
# Parameters

survey_year: 2015            # survey year being considered
species:
  text_code: pacific_hake    # target species for the survey year -- species name
  number_code: 22500         # target species for the survey year -- numeric code
CAN_haul_offset: 200         # The value to be added to the Canadian's haul number
report_path:    /mnt/c/rthomas/Projects/EchoPop_validation/Reports/2015/EchoPop           # Path to output reports

##############################################################################
# Directory path that contains all input data needed

data_root_dir: /mnt/c/rthomas/Projects/EchoPop_validation/data

##############################################################################
# Input data files

biological:
  length:
    US:
      filename: Biological/Updated/2015/US/biodata_length_2015_US.xlsx
      sheetname: Sheet1
    CAN:
      filename: Biological/Updated/2015/CAN/biodata_length_2015_CAN.xlsx
      sheetname: Sheet1
  specimen:
    US:
      filename: Biological/Updated/2015/US/biodata_specimen_2015_US.xlsx
      sheetname: Sheet1
    CAN:
      filename: Biological/Updated/2015/CAN/biodata_specimen_2015_CAN.xlsx
      sheetname: Sheet1
  catch:
    US:
      filename: Biological/Updated/2015/US/biodata_catch_2015_US.xlsx
      sheetname: Sheet1
    CAN:
      filename: Biological/Updated/2015/CAN/biodata_catch_2015_CAN.xlsx
      sheetname: Sheet1
#  haul_to_transect:
#    US:
#     filename: Biological/US/haul_to_transect_mapping_2017.xlsx
#     sheetname: Sheet1
#   CAN:
#      filename: Biological/CAN/haul_to_transect_mapping_2017_CAN.xlsx
#      sheetname: Sheet1
stratification:
  strata:
    # The two stratification types are found in two sheets: "Base KS" and "INPFC"
    filename: Stratification/2015/EP_US&CAN strata 2015 shoreside.xlsx
    sheetname: [ INPFC , Base KS ]
  geo_strata:
    # The two stratification types are found in two sheets: "stratification1" and "INPFC"
    filename: Stratification/2015/EP_Stratification_geographic_Lat_2015_shoreside.xlsx
    sheetname: [ INPFC , Base KS ]
NASC:
  # NASC values
  no_age1:
    # file that excludes age1 values
    #filename: Exports/US_CAN_detailsa_2019_table2y+_ALL_final - updated.xlsx
    filename: Exports/2015/US_CAN_NASC_2015_table_no_age1.xlsx
    sheetname: Sheet1
  all_ages:
    # file that includes all ages
    #filename: Exports/US_CAN_detailsa_2019_table1y+_ALL_final - updated.xlsx
    filename: Exports/2015/US_CAN_NASC_2015_table_all_ages.xlsx
    sheetname: Sheet1
export_regions:
  all_ages:
    # filename: Stratification/US_CAN_2019_transect_region_haul_age1+ auto_final.xlsx
    filename: Stratification/2015/CAN_US_2015_transect_region_haul_all_ages.xlsx
    sheetname: Sheet1
  no_age1:
    filename: Stratification/2015/CAN_US_2015_transect_region_haul_no_age1.xlsx
    sheetname: Sheet1
gear_data:
  US:
    filename: Biological/Updated/2015/US/biodata_gear_2015_US.xlsx
    sheetname: Sheet1
  CAN:
    filename: Biological/Updated/2015/CAN/biodata_gear_2015_CAN.xlsx
    sheetname: Sheet1
kriging:
  mesh:
    filename: Kriging files & parameters/Kriging grid files/krig_grid2_5nm_cut_centroids_2013.xlsx
    sheetname: krigedgrid2_5nm_forChu
  isobath_200m:
    # filename: Kriging_files/Kriging_grid_files/Smoothing_EasyKrig.xlsx
    filename: Kriging files & parameters/Kriging grid files/transformation_isobath_coordinates.xlsx
    sheetname: Smoothing_EasyKrig
  vario_krig_para:
    # NOTE: This file is not currently used
    filename: Kriging files & parameters/2015/default_vario_krig_settings_final.xlsx
    sheetname: Sheet1
...
